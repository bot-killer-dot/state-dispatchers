name: Deploy to Vercel

# Deploys www.statedispatchers.com on every push to main.
# Needs one repository secret: VERCEL_TOKEN (create it at https://vercel.com/account/tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_kWWKxgALTm9vK9Iwc04PNkXo
  VERCEL_PROJECT_ID: prj_Nqppp1sQDtYrrV8AjIm8wfrQnGuA

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a repository secret named VERCEL_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@50.44.0

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
